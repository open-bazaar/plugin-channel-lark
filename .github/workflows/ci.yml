name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install bcn
        env:
          GONOSUMDB: github.com/yuchanns/bazaar-compute-node
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install -ldflags "-X main.HostVersion=0.4.0-rc.1" github.com/yuchanns/bazaar-compute-node/cmd/bcn@0.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bcn" --version
      - name: Vet & Test (offline)
        working-directory: tests
        run: |
          go vet ./...
          go test -v -timeout 5m -count=1 -run TestOffline ./...

  e2e:
    name: E2E (Lark)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: lark-e2e
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install bcn
        env:
          GONOSUMDB: github.com/yuchanns/bazaar-compute-node
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install -ldflags "-X main.HostVersion=0.4.0-rc.1" github.com/yuchanns/bazaar-compute-node/cmd/bcn@0.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bcn" --version
      - name: Run Live Lark E2E
        working-directory: tests
        env:
          BCN_REQUIRE_LIVE_E2E: '1'
          BCN_E2E_ARTIFACTS: ${{ github.workspace }}/.artifacts/e2e
          LARK_TEST_APP_ID: ${{ vars.LARK_TEST_APP_ID }}
          LARK_TEST_APP_SECRET: ${{ secrets.LARK_TEST_APP_SECRET }}
          LARK_DRIVER_APP_ID: ${{ vars.LARK_DRIVER_APP_ID }}
          LARK_DRIVER_APP_SECRET: ${{ secrets.LARK_DRIVER_APP_SECRET }}
          LARK_TEST_CHAT_ID: ${{ vars.LARK_TEST_CHAT_ID }}
        run: |
          mkdir -p "$BCN_E2E_ARTIFACTS"
          go test -v -timeout 15m -count=1 -run TestLiveLarkE2E ./...
      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lark-e2e
          path: |
            .artifacts/e2e/**/*.log
            .artifacts/e2e/**/*.jsonl
          include-hidden-files: true
          if-no-files-found: warn
